# Führt bei jedem Push die Tests aus. Ein roter Haken heißt: nicht mergen.
# Häufigster Grund: App-Dateien geändert, ohne `npm run sw:version` auszuführen.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rechenkern, Getränkedaten, Service Worker
        run: npm test
      - name: Browser einrichten
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-Test
        run: npm run test:e2e
