# Führt bei jedem Push die Tests aus. Ein roter Haken heißt: nicht mergen.
# Häufigster Grund: App-Dateien geändert, ohne `npm run sw:version` auszuführen.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rechenkern, Getränkedaten, Service Worker, Konfiguration
        run: npm test

  browser:
    # chromium entspricht Chrome auf Android, webkit der Technik von Safari auf dem iPhone.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Browser einrichten
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser-Test (${{ matrix.browser }})
        run: npm run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}
